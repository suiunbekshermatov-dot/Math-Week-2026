<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Math Week - IT & Business College</title> <style> body { font-family: Arial, sans-serif; background: #eef4ff; margin: 0; padding: 20px; } .container { max-width: 800px; margin: auto; } .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); margin-bottom: 20px; } h1, h2, h3, p { text-align: center; } .hidden { display: none; } input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; font-size: 16px; box-sizing: border-box; } input { border: 1px solid #ccc; } button { border: none; background: #2b6cd4; color: white; font-weight: bold; cursor: pointer; } button:hover { background: #154a9a; } .secondary { background: #dbe8ff; color: #154a9a; } .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .answer-btn { text-align: left; background: #f4f8ff; color: #173153; border: 1px solid #cfe0ff; } .tile { background: #eaf1ff; color: #173153; border: 2px solid #cfe0ff; } table { width: 100%; border-collapse: collapse; margin-top: 10px; } th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; } @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } } </style> </head> <body> <div class="container"> <div id="welcome" class="card"> <h1>Math Week</h1> <h2>IT & Business College</h2> <p>Simple Math Week website</p> <button onclick="showRegister()">Start</button> <button class="secondary" onclick="showAdmin()">Administrator Panel</button> </div> <div id="register" class="card hidden"> <h2>Student Registration</h2> <input id="fio" placeholder="Full Name (FIO)"> <input id="group" placeholder="Group"> <input id="studentId" placeholder="Student ID"> <button onclick="saveStudent()">Enter</button> <button class="secondary" onclick="showWelcome()">Back</button> </div> <div id="menu" class="card hidden"> <h2>Choose Game</h2> <p id="studentInfo"></p> <div class="grid"> <button onclick="openQuiz()">Math Quiz</button> <button onclick="openPuzzle()">Math Puzzle</button> <button onclick="openMemory()">Math Memory</button> <button onclick="openEscape()">Math Escape</button> </div> <button onclick="openLeaderboard()">Leaderboard</button> <button class="secondary" onclick="showRegister()">Change Student</button> </div> <div id="quiz" class="card hidden"> <h2>Math Quiz</h2> <p id="quizQuestion"></p> <div id="quizAnswers"></div> <p id="quizResult"></p> <button class="secondary" onclick="backMenu()">Back</button> </div> <div id="puzzle" class="card hidden"> <h2>Math Puzzle</h2> <p id="puzzleQuestion"></p> <p>Selected answer: <span id="puzzleSelected">_</span></p> <div id="puzzleTiles" class="grid"></div> <button onclick="checkPuzzle()">Check Answer</button> <button class="secondary" onclick="nextPuzzle()">Next Puzzle</button> <button class="secondary" onclick="backMenu()">Back</button> <p id="puzzleResult"></p> </div> <div id="memory" class="card hidden"> <h2>Math Memory</h2> <div id="memoryBoard" class="grid"></div> <p id="memoryResult"></p> <button class="secondary" onclick="openMemory()">Restart</button> <button class="secondary" onclick="backMenu()">Back</button> </div> <div id="escape" class="card hidden"> <h2>Math Escape</h2> <p id="escapeQuestion"></p> <input id="escapeInput" placeholder="Enter answer"> <button onclick="checkEscape()">Unlock</button> <button class="secondary" onclick="backMenu()">Back</button> <p id="escapeResult"></p> </div> <div id="leaderboard" class="card hidden"> <h2>Leaderboard</h2> <table> <thead> <tr> <th>Game</th> <th>Name</th> <th>Group</th> <th>ID</th> <th>Score</th> </tr> </thead> <tbody id="leaderboardBody"></tbody> </table> <button class="secondary" onclick="backMenu()">Back</button> </div> <div id="admin" class="card hidden"> <h2>Admin Panel</h2> <table> <thead> <tr> <th>Game</th> <th>Name</th> <th>Group</th> <th>ID</th> <th>Score</th> </tr> </thead> <tbody id="adminBody"></tbody> </table> <button onclick="exportCSV()">Export CSV</button> <button onclick="clearResults()">Clear Results</button> <button class="secondary" onclick="showWelcome()">Back</button> </div> </div> <script> let student = null; let quizData = []; let quizIndex = 0; let quizScore = 0; let puzzleData = []; let puzzleIndex = 0; let puzzleScore = 0; let puzzleAnswer = ""; let memoryCards = []; let memoryFirst = null; let memorySecond = null; let memoryLock = false; let memoryMatches = 0; let escapeData = []; let escapeIndex = 0; let escapeScore = 0; function hideAll() { document.getElementById("welcome").classList.add("hidden"); document.getElementById("register").classList.add("hidden"); document.getElementById("menu").classList.add("hidden"); document.getElementById("quiz").classList.add("hidden"); document.getElementById("puzzle").classList.add("hidden"); document.getElementById("memory").classList.add("hidden"); document.getElementById("escape").classList.add("hidden"); document.getElementById("leaderboard").classList.add("hidden"); document.getElementById("admin").classList.add("hidden"); } function showWelcome() { hideAll(); document.getElementById("welcome").classList.remove("hidden"); } function showRegister() { hideAll(); document.getElementById("register").classList.remove("hidden"); } function saveStudent() { const fio = document.getElementById("fio").value.trim(); const group = document.getElementById("group").value.trim(); const studentId = document.getElementById("studentId").value.trim(); if (!fio || !group || !studentId) { alert("Please fill all fields"); return; } student = { fio: fio, group: group, studentId: studentId }; document.getElementById("studentInfo").innerText = student.fio + " | " + student.group + " | " + student.studentId; hideAll(); document.getElementById("menu").classList.remove("hidden"); } function backMenu() { hideAll(); document.getElementById("menu").classList.remove("hidden"); } function shuffle(array) { return array.sort(() => Math.random() - 0.5); } function saveResult(game, score, total) { let results = JSON.parse(localStorage.getItem("mathWeekResults") || "[]"); results.push({ game: game, fio: student.fio, group: student.group, studentId: student.studentId, score: score + "/" + total }); localStorage.setItem("mathWeekResults", JSON.stringify(results)); } function renderLeaderboard() { let results = JSON.parse(localStorage.getItem("mathWeekResults") || "[]"); const body = document.getElementById("leaderboardBody"); body.innerHTML = ""; if (results.length === 0) { body.innerHTML = "<tr><td colspan='5'>No results yet</td></tr>"; return; } results.forEach(r => { body.innerHTML += ` <tr> <td>${r.game}</td> <td>${r.fio}</td> <td>${r.group}</td> <td>${r.studentId}</td> <td>${r.score}</td> </tr> `; }); } function openLeaderboard() { renderLeaderboard(); hideAll(); document.getElementById("leaderboard").classList.remove("hidden"); } function showAdmin() { const password = prompt("Enter admin password"); if (password !== "qwerty321") { alert("Wrong password"); return; } let results = JSON.parse(localStorage.getItem("mathWeekResults") || "[]"); const body = document.getElementById("adminBody"); body.innerHTML = ""; if (results.length === 0) { body.innerHTML = "<tr><td colspan='5'>No results yet</td></tr>"; } else { results.forEach(r => { body.innerHTML += ` <tr> <td>${r.game}</td> <td>${r.fio}</td> <td>${r.group}</td> <td>${r.studentId}</td> <td>${r.score}</td> </tr> `; }); } hideAll(); document.getElementById("admin").classList.remove("hidden"); } function exportCSV() { let results = JSON.parse(localStorage.getItem("mathWeekResults") || "[]"); if (results.length === 0) { alert("No results"); return; } let csv = "Game,Name,Group,Student ID,Score\n"; results.forEach(r => { csv += `${r.game},${r.fio},${r.group},${r.studentId},${r.score}\n`; }); const blob = new Blob([csv], { type: "text/csv" }); const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = "math_week_results.csv"; a.click(); URL.revokeObjectURL(url); } function clearResults() { if (!confirm("Clear all results?")) return; localStorage.removeItem("mathWeekResults"); showAdmin(); } /* QUIZ */ function openQuiz() { quizData = shuffle([ { q: "What is 12 × 4?", a: ["48", "42", "36", "50"], c: 0 }, { q: "25% of 200?", a: ["25", "40", "50", "70"], c: 2 }, { q: "Solve 3x = 27", a: ["7", "8", "9", "10"], c: 2 }, { q: "Next: 2, 4, 8, 16, ?", a: ["24", "32", "30", "34"], c: 1 }, { q: "20% of 250?", a: ["40", "45", "50", "55"], c: 2 } ]); quizIndex = 0; quizScore = 0; hideAll(); document.getElementById("quiz").classList.remove("hidden"); renderQuiz(); } function renderQuiz() { let q = quizData[quizIndex]; document.getElementById("quizQuestion").innerText = q.q; document.getElementById("quizResult").innerText = ""; const answers = document.getElementById("quizAnswers"); answers.innerHTML = ""; q.a.forEach((text, i) => { let btn = document.createElement("button"); btn.className = "answer-btn"; btn.innerText = text; btn.onclick = function() { if (i === q.c) { quizScore++; document.getElementById("quizResult").innerText = "Correct"; } else { document.getElementById("quizResult").innerText = "Wrong"; } setTimeout(() => { quizIndex++; if (quizIndex >= quizData.length) { saveResult("Math Quiz", quizScore, quizData.length); alert("Quiz finished"); backMenu(); } else { renderQuiz(); } }, 700); }; answers.appendChild(btn); }); } /* PUZZLE */ function openPuzzle() { puzzleData = shuffle([ { q: "18 + 24 = ?", answer: "42" }, { q: "7 × 6 = ?", answer: "42" }, { q: "25% of 160 = ?", answer: "40" }, { q: "5x = 45, x = ?", answer: "9" }, { q: "Next: 3, 6, 12, 24, ?", answer: "48" } ]); puzzleIndex = 0; puzzleScore = 0; puzzleAnswer = ""; hideAll(); document.getElementById("puzzle").classList.remove("hidden"); renderPuzzle(); } function renderPuzzle() { const item = puzzleData[puzzleIndex]; document.getElementById("puzzleQuestion").innerText = item.q; document.getElementById("puzzleSelected").innerText = "_"; document.getElementById("puzzleResult").innerText = ""; puzzleAnswer = ""; const tiles = document.getElementById("puzzleTiles"); tiles.innerHTML = ""; let numbers = shuffle((item.answer + "0123456789").split("")).slice(0, 8); numbers.forEach(n => { let btn = document.createElement("button"); btn.className = "tile"; btn.innerText = n; btn.onclick = function() { puzzleAnswer += n; document.getElementById("puzzleSelected").innerText = puzzleAnswer; btn.disabled = true; }; tiles.appendChild(btn); }); } function checkPuzzle() { const item = puzzleData[puzzleIndex]; if (puzzleAnswer === item.answer) { puzzleScore++; document.getElementById("puzzleResult").innerText = "Correct"; } else { document.getElementById("puzzleResult").innerText = "Wrong. Correct answer: " + item.answer; } } function nextPuzzle() { puzzleIndex++; if (puzzleIndex >= puzzleData.length) { saveResult("Math Puzzle", puzzleScore, puzzleData.length); alert("Puzzle finished"); backMenu(); } else { renderPuzzle(); } } /* MEMORY */ function openMemory() { let pairs = shuffle([ ["6×7","42"], ["12+18","30"], ["5²","25"], ["√49","7"] ]); memoryCards = []; pairs.forEach((p, i) => { memoryCards.push({ id: i, text: p[0] }); memoryCards.push({ id: i, text: p[1] }); }); memoryCards = shuffle(memoryCards); memoryFirst = null; memorySecond = null; memoryLock = false; memoryMatches = 0; hideAll(); document.getElementById("memory").classList.remove("hidden"); renderMemory(); } function renderMemory() { const board = document.getElementById("memoryBoard"); board.innerHTML = ""; document.getElementById("memoryResult").innerText = ""; memoryCards.forEach((card, index) => { let btn = document.createElement("button"); btn.className = "memory-cell"; btn.innerText = "?"; btn.onclick = function() { if (memoryLock || btn.classList.contains("matched") || btn === memoryFirst) return; btn.innerText = card.text; btn.classList.add("open"); if (!memoryFirst) { memoryFirst = btn; memoryFirst.index = index; return; } memorySecond = btn; memorySecond.index = index; memoryLock = true; let ok = memoryCards[memoryFirst.index].id === memoryCards[memorySecond.index].id; setTimeout(() => { if (ok) { memoryFirst.classList.add("matched"); memorySecond.classList.add("matched"); memoryMatches++; if (memoryMatches === 4) { saveResult("Math Memory", 4, 4); alert("Memory finished"); backMenu(); } } else { memoryFirst.innerText = "?"; memorySecond.innerText = "?"; memoryFirst.classList.remove("open"); memorySecond.classList.remove("open"); } memoryFirst = null; memorySecond = null; memoryLock = false; }, 700); }; board.appendChild(btn); }); } /* ESCAPE */ function openEscape() { escapeData = shuffle([ { q: "Solve: 5x = 25", a: "5" }, { q: "20% of 250 = ?", a: "50" }, { q: "Next: 4, 9, 16, 25, ?", a: "36" }, { q: "Triangle angles 50 and 60. Third angle?", a: "70" } ]); escapeIndex = 0; escapeScore = 0; hideAll(); document.getElementById("escape").classList.remove("hidden"); renderEscape(); } function renderEscape() { document.getElementById("escapeQuestion").innerText = escapeData[escapeIndex].q; document.getElementById("escapeInput").value = ""; document.getElementById("escapeResult").innerText = ""; } function checkEscape() { let value = document.getElementById("escapeInput").value.trim(); let correct = escapeData[escapeIndex].a; if (value === correct) { escapeScore++; document.getElementById("escapeResult").innerText = "Unlocked"; setTimeout(() => { escapeIndex++; if (escapeIndex >= escapeData.length) { saveResult("Math Escape", escapeScore, escapeData.length); alert("Escape finished"); backMenu(); } else { renderEscape(); } }, 700); } else { document.getElementById("escapeResult").innerText = "Wrong"; } } showWelcome(); </script> </body> </html>
